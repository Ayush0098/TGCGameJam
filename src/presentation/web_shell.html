<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
<title>$GODOT_PROJECT_NAME</title>
<style>
html, body, #canvas { margin: 0; padding: 0; border: 0; }
body { color: #ffe08a; background-color: #1d2740; overflow: hidden; touch-action: none; font-family: "Trebuchet MS", sans-serif; }
#canvas { display: block; }
#canvas:focus { outline: none; }
#loader {
  position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: #1d2740; transition: opacity 0.5s ease; z-index: 10;
}
#loader.done { opacity: 0; pointer-events: none; }
#bulb { width: 120px; height: 150px; }
#glass { fill: #3a4258; transition: fill 0.2s; }
#title { font-size: 54px; font-weight: 900; letter-spacing: 2px; margin: 18px 0 6px; transform: rotate(-2deg);
  text-shadow: 3px 3px 0 #243043, -1px -1px 0 #243043; }
#line { color: #dfe5f2; font-size: 18px; min-height: 24px; }
#bar { width: 320px; height: 10px; border: 3px solid #f2e8cf; margin-top: 16px; }
#fill { width: 0; height: 100%; background: #ffd27a; }
#error { color: #ffb3a8; max-width: 640px; text-align: center; margin-top: 12px; }
</style>
$GODOT_HEAD_INCLUDE
</head>
<body>
<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
<noscript>Your browser does not support JavaScript.</noscript>
<div id="loader">
  <svg id="bulb" viewBox="0 0 120 150">
    <g stroke="#f2e8cf" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
      <path id="glass" d="M60 10 A42 42 0 0 1 85 86 L85 100 L35 100 L35 86 A42 42 0 0 1 60 10 Z"/>
      <path d="M45 62 Q52 48 60 62 Q68 48 75 62" fill="none" stroke="#ffd27a" id="filament"/>
      <path d="M38 112 H82 M42 124 H78 M50 136 H70" fill="none"/>
    </g>
  </svg>
  <div id="title">LIGHTBULB MOMENT</div>
  <div id="line">Inking the Sunday comics...</div>
  <div id="bar"><div id="fill"></div></div>
  <div id="error"></div>
</div>
<script src="$GODOT_URL"></script>
<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const engine = new Engine(GODOT_CONFIG);
// Keyboard players must not have to click first: keep the game window and canvas
// focused (also when embedded in an itch.io page) from load, on any pointer or key
// activity, and again whenever focus drifts away.
function focusGame() {
  try { window.focus(); } catch (e) {}
  const canvas = document.getElementById("canvas");
  if (canvas) {
    if (!canvas.hasAttribute("tabindex")) { canvas.setAttribute("tabindex", "0"); }
    try { canvas.focus({ preventScroll: true }); } catch (e) {}
  }
}
focusGame();
window.addEventListener("load", focusGame);
document.addEventListener("visibilitychange", focusGame);
["pointerenter", "pointermove", "pointerdown", "touchstart", "keydown", "focusin"].forEach(function (name) {
  document.addEventListener(name, function () { if (document.activeElement !== document.getElementById("canvas")) { focusGame(); } }, { passive: true, capture: true });
});
// Only keep nudging during start-up, so the page's own controls stay usable later.
const focusTimer = setInterval(function () { if (!document.hasFocus() || document.activeElement !== document.getElementById("canvas")) { focusGame(); } }, 500);
setTimeout(function () { clearInterval(focusTimer); }, 40000);
(function () {
  const lines = ["Inking the Sunday comics...", "Screwing in the bulbs...", "Hiding thoughts in the dark...", "Sharpening the editor's red pen..."];
  let index = 0;
  const line = document.getElementById("line");
  const timer = setInterval(() => { index = (index + 1) % lines.length; line.textContent = lines[index]; }, 2000);
  const fill = document.getElementById("fill");
  const glass = document.getElementById("glass");
  const loader = document.getElementById("loader");
  const missing = Engine.getMissingFeatures({ threads: false });
  if (missing.length !== 0) {
    document.getElementById("error").textContent = "This browser is missing: " + missing.join(", ");
    clearInterval(timer);
    return;
  }
  engine.startGame({
    onProgress: function (current, total) {
      if (total > 0) {
        const ratio = current / total;
        fill.style.width = (ratio * 100) + "%";
        // The bulb glows brighter as the page loads.
        glass.style.fill = "rgb(" + Math.round(58 + 197 * ratio) + "," + Math.round(66 + 159 * ratio) + "," + Math.round(88 + 34 * ratio) + ")";
      }
    },
  }).then(() => {
    clearInterval(timer);
    glass.style.fill = "#ffe17a";
    line.textContent = "Lights on!";
    focusGame();
    setTimeout(() => { loader.classList.add("done"); }, 350);
  }, (err) => {
    clearInterval(timer);
    document.getElementById("error").textContent = String(err);
  });
})();
</script>
</body>
</html>
